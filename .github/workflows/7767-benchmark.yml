name: '7767 controlled benchmark'
run-name: '7767 ${{ inputs.mode || ''register'' }} sample=${{ inputs.sample || ''0'' }} batch=${{ inputs.batch || ''register'' }} worker=${{ inputs.worker || ''1'' }}'

on:
  push:
    branches: [bench-7767]
    paths:
      - '.github/workflows/7767-benchmark.yml'
      - '.github/scripts/7767-benchmark.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'A=baseline B=retry C=retry+restore D=retry+restore without save'
        type: choice
        options: [A, B, C, D]
        required: true
      sample:
        description: 'Repetition number'
        type: string
        default: '1'
      batch:
        description: 'serial or a named concurrency batch'
        type: string
        default: serial
      worker:
        description: 'Worker number within the batch'
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

jobs:
  register:
    if: github.repository == 'lymerin/shenyu' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Benchmark workflow registered; no Maven workload on push.'

  benchmark:
    if: github.repository == 'lymerin/shenyu' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/bench-7767'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODE: ${{ inputs.mode }}
      SAMPLE: ${{ inputs.sample }}
      BATCH: ${{ inputs.batch }}
      WORKER: ${{ inputs.worker }}
      BENCH_OUTPUT: /tmp/shenyu-7767-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Record checkout and start disk sampler
        run: python3 .github/scripts/7767-benchmark.py init
      - name: Check retry classifier
        run: bash .github/scripts/maven-with-retry-test.sh
      - name: Free disk space when needed
        run: |
          python3 .github/scripts/7767-benchmark.py mark cleanup_start
          bash .github/scripts/free-disk-space.sh
          python3 .github/scripts/7767-benchmark.py snapshot after_cleanup
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: '17'
          distribution: temurin
          cache: ''
      - name: Install mvnd
        shell: bash
        run: |
          MVND_VERSION=1.0.6
          curl -sfL https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip -o mvnd.zip
          unzip -q mvnd.zip
          mkdir -p $HOME/.local
          mv maven-mvnd-${MVND_VERSION}-linux-amd64 $HOME/.local/mvnd
          echo "$HOME/.local/mvnd/bin" >> $GITHUB_PATH
          echo "MVND_HOME=$HOME/.local/mvnd" >> $GITHUB_ENV
      - name: Record environment and before-restore disk
        run: |
          python3 .github/scripts/7767-benchmark.py environment
          python3 .github/scripts/7767-benchmark.py snapshot before_restore
          python3 .github/scripts/7767-benchmark.py mark restore_start
      - name: Restore ShenYu Maven Repos
        id: restore
        if: inputs.mode == 'C' || inputs.mode == 'D'
        uses: actions/cache/restore@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Record restored cache
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        run: python3 .github/scripts/7767-benchmark.py restored
      - name: Build with Maven
        run: python3 .github/scripts/7767-benchmark.py build
      - name: Record Maven repository and Docker images
        run: python3 .github/scripts/7767-benchmark.py snapshot after_build
      - name: Record before-save counters
        run: python3 .github/scripts/7767-benchmark.py snapshot before_save
      - name: Save ShenYu Maven Repos
        id: save
        if: inputs.mode != 'D'
        uses: actions/cache/save@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Record after-save counters
        run: python3 .github/scripts/7767-benchmark.py snapshot after_save
      - name: Build Docker Image
        run: python3 .github/scripts/7767-benchmark.py docker-save
      - name: Finalize measurements
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          CACHE_PRIMARY_KEY: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        run: python3 .github/scripts/7767-benchmark.py finalize
      - name: Upload benchmark measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.mode }}-${{ inputs.sample }}-${{ inputs.worker }}
          path: ${{ env.BENCH_OUTPUT }}
          retention-days: 14
          if-no-files-found: error
